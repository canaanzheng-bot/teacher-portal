<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSLC · Student Evaluation Report Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600;1,9..144,700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   MSLC Student Evaluation Report Generator
   Palette: navy #141e30 / gold #c8962e / cream #f8f5f0
   ========================================================================== */

:root {
  /* Primary green (matches assignment-tracker header) */
  --navy: #1f5e3e;
  --navy-soft: #2a7050;
  --navy-deep: #154a30;

  /* Accent (was gold, now matches tracker's emerald check marks) */
  --gold: #16a34a;
  --gold-soft: #22c55e;
  --gold-deep: #15803d;

  /* Cream / off-white surfaces */
  --cream: #f7f4ec;
  --cream-warm: #f0ebe1;
  --cream-deep: #e8e2d4;

  /* Text */
  --ink: #1a1a1a;
  --ink-soft: #4a4a4a;
  --ink-muted: #8a8676;

  /* Surfaces */
  --paper: #ffffff;
  --rule: #e8e4dc;

  /* Status colors */
  --success: #16a34a;
  --danger: #dc2626;

  --display: 'Fraunces', 'Noto Serif SC', serif;
  --sans: 'Outfit', 'Noto Sans SC', system-ui, sans-serif;
  --cn: 'Noto Sans SC', 'PingFang SC', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Decorative cream gradient + grain so it doesn't feel flat */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at top left, rgba(22, 163, 74, 0.04) 0%, transparent 40%),
    radial-gradient(ellipse at bottom right, rgba(31, 94, 62, 0.03) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ==========================================================================
   TOP BAR
   ========================================================================== */

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--navy);
  color: var(--cream);
  border-bottom: 1px solid var(--navy-deep);
  box-shadow: 0 2px 20px rgba(11, 50, 30, 0.10);
}

.topbar-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 18px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  user-select: none;
}

.brand-mark {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background-color: var(--cream);
  background-image: var(--mslc-logo-bg, none);
  background-size: 90%;
  background-position: center;
  background-repeat: no-repeat;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.brand-text { line-height: 1.15; }
.brand-text .en {
  font-family: var(--display);
  font-style: italic;
  font-weight: 600;
  font-size: 20px;
  letter-spacing: -0.01em;
}
.brand-text .cn {
  font-family: var(--cn);
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--gold-soft);
  text-transform: uppercase;
  margin-top: 2px;
}

.topbar-meta {
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 12px;
  color: rgba(248,245,240,0.7);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.topbar-meta .sep {
  width: 1px;
  height: 16px;
  background: rgba(248,245,240,0.2);
}

/* ==========================================================================
   MAIN LAYOUT
   ========================================================================== */

main {
  position: relative;
  z-index: 1;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 32px 80px;
}

.view { display: none; animation: fadeIn 0.4s ease; }
.view.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ==========================================================================
   HOME VIEW — teacher selection
   ========================================================================== */

.hero {
  padding: 64px 0 40px;
  text-align: center;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 56px;
  position: relative;
}

.hero-eyebrow {
  font-family: var(--cn);
  font-size: 12px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: 18px;
}

.hero-title {
  font-family: var(--display);
  font-style: italic;
  font-weight: 600;
  font-size: clamp(36px, 5vw, 56px);
  line-height: 1.05;
  color: var(--navy);
  letter-spacing: -0.02em;
  margin-bottom: 12px;
}

.hero-title em {
  font-style: italic;
  color: var(--gold);
}

.hero-sub {
  font-family: var(--cn);
  font-size: 16px;
  color: var(--ink-soft);
  font-weight: 400;
  letter-spacing: 0.05em;
}

.hero-rule {
  width: 56px;
  height: 1px;
  background: var(--gold);
  margin: 28px auto 0;
}

.teacher-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 24px;
}

.teacher-card {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 32px 28px 28px;
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.2, 0.7, 0.3, 1);
  position: relative;
  overflow: hidden;
  text-align: left;
}

.teacher-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--gold);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.3, 1);
}

.teacher-card::after {
  content: '';
  position: absolute;
  top: 24px;
  right: 28px;
  width: 8px;
  height: 8px;
  border-top: 1px solid var(--ink-muted);
  border-right: 1px solid var(--ink-muted);
  transform: rotate(45deg);
  opacity: 0;
  transition: all 0.35s cubic-bezier(0.2, 0.7, 0.3, 1);
}

.teacher-card:hover {
  border-color: var(--navy);
  transform: translateY(-3px);
  box-shadow: 0 18px 32px -16px rgba(20,30,48,0.18);
}

.teacher-card:hover::before { transform: scaleX(1); }
.teacher-card:hover::after { opacity: 0.6; transform: rotate(45deg) translate(4px, -4px); }

.teacher-card.online {
  background: linear-gradient(180deg, var(--paper) 0%, var(--cream-warm) 100%);
}

.teacher-card-num {
  font-family: var(--display);
  font-style: italic;
  font-size: 13px;
  color: var(--gold);
  letter-spacing: 0.1em;
  margin-bottom: 18px;
}

.teacher-card-name-cn {
  font-family: var(--cn);
  font-size: 26px;
  font-weight: 500;
  color: var(--navy);
  letter-spacing: 0.02em;
  margin-bottom: 6px;
}

.teacher-card-name-en {
  font-family: var(--display);
  font-style: italic;
  font-weight: 400;
  font-size: 17px;
  color: var(--ink-soft);
  margin-bottom: 24px;
}

.teacher-card-grades {
  border-top: 1px solid var(--rule);
  padding-top: 16px;
  font-family: var(--cn);
  font-size: 14px;
  color: var(--ink);
  letter-spacing: 0.04em;
  line-height: 1.7;
}

.teacher-card-grades .en {
  font-family: var(--sans);
  font-size: 12px;
  color: var(--ink-muted);
  letter-spacing: 0.08em;
  margin-top: 4px;
  text-transform: uppercase;
}

.teacher-card .pill-online {
  display: inline-block;
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 4px 10px;
  border: 1px solid var(--gold);
  color: var(--gold-deep);
  border-radius: 100px;
  margin-top: 8px;
}

.teacher-card-count {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px dashed var(--rule);
  font-family: var(--display);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

.count-pill {
  display: inline-grid;
  place-items: center;
  min-width: 26px;
  height: 26px;
  padding: 0 8px;
  border-radius: 100px;
  background: var(--navy);
  color: var(--cream);
  font-family: var(--sans);
  font-style: normal;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.02em;
  font-feature-settings: 'tnum';
}

.count-pill.zero {
  background: transparent;
  color: var(--danger);
  border: 1px solid var(--danger);
}

.count-label {
  font-family: var(--cn);
  font-style: normal;
  font-size: 12px;
  color: var(--ink-soft);
  letter-spacing: 0.05em;
}

.loading-dot {
  display: inline-block;
  font-family: var(--display);
  font-style: italic;
  color: var(--ink-muted);
  font-size: 14px;
  animation: pulse 1.4s ease-in-out infinite;
}

.home-banner {
  margin: 28px auto 0;
  max-width: 720px;
  padding: 18px 22px;
  background: var(--paper);
  border-left: 3px solid var(--gold);
  border-radius: 3px;
  text-align: left;
  box-shadow: 0 6px 20px -10px rgba(20,30,48,0.15);
}

.home-banner.error { border-left-color: var(--danger); }
.home-banner.warn  { border-left-color: var(--gold, #c9a227); }

.home-banner-title {
  font-family: var(--display);
  font-style: italic;
  font-weight: 600;
  font-size: 17px;
  color: var(--navy);
  margin-bottom: 6px;
}

.home-banner-body {
  font-family: var(--cn);
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.55;
  letter-spacing: 0.02em;
  margin-bottom: 10px;
}

.home-banner-link {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gold-deep);
  text-decoration: none;
}

.home-banner-link:hover { color: var(--gold); }

/* ==========================================================================
   WORKSPACE VIEW
   ========================================================================== */

.workspace-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 48px 0 28px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 36px;
  gap: 32px;
  flex-wrap: wrap;
}

.workspace-back {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--ink-muted);
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0;
  margin-bottom: 12px;
  transition: color 0.2s;
}

.workspace-back:hover { color: var(--navy); }
.workspace-back::before { content: '←'; font-size: 16px; }

.workspace-title-cn {
  font-family: var(--cn);
  font-size: 32px;
  font-weight: 500;
  color: var(--navy);
  letter-spacing: 0.02em;
}

.workspace-title-en {
  font-family: var(--display);
  font-style: italic;
  font-weight: 400;
  font-size: 18px;
  color: var(--ink-soft);
  margin-top: 2px;
}

.workspace-title-grades {
  font-family: var(--cn);
  font-size: 13px;
  color: var(--gold-deep);
  letter-spacing: 0.1em;
  margin-top: 12px;
}

.unit-control {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.unit-control label {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

.unit-control input {
  font-family: var(--display);
  font-style: italic;
  font-size: 17px;
  font-weight: 500;
  color: var(--navy);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 10px 14px;
  min-width: 260px;
  letter-spacing: 0.02em;
  transition: border-color 0.2s;
}

.unit-control input:focus {
  outline: none;
  border-color: var(--gold);
}

/* Student strip */
.student-strip {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 24px 28px;
  margin-bottom: 32px;
}

.student-strip-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  gap: 16px;
  flex-wrap: wrap;
}

.student-strip-title {
  font-family: var(--cn);
  font-size: 15px;
  font-weight: 500;
  color: var(--navy);
  letter-spacing: 0.05em;
}

.student-strip-title .en {
  font-family: var(--display);
  font-style: italic;
  font-weight: 400;
  font-size: 13px;
  color: var(--ink-muted);
  margin-left: 10px;
}

.student-strip-count {
  font-family: var(--display);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-muted);
}

.student-strip-count strong {
  color: var(--gold-deep);
  font-weight: 600;
  font-style: normal;
  font-family: var(--sans);
}

.student-chips {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.level-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.level-label {
  font-family: var(--display);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-soft);
  letter-spacing: 0.01em;
  padding-left: 2px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.level-label .count {
  font-family: var(--sans);
  font-style: normal;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-muted);
  background: var(--paper);
  padding: 2px 7px;
  border-radius: 100px;
}

.level-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  background: var(--cream);
  border: 1px solid var(--rule);
  border-radius: 100px;
  padding: 7px 14px 7px 14px;
  font-family: var(--cn);
  font-size: 13px;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.chip:hover {
  border-color: var(--navy);
  background: var(--paper);
}

.chip.active {
  background: var(--navy);
  color: var(--cream);
  border-color: var(--navy);
}

.chip.done {
  background: rgba(74, 124, 62, 0.08);
  border-color: rgba(74, 124, 62, 0.3);
}

.chip.done .check {
  color: var(--success);
  font-weight: 700;
  font-size: 12px;
}

.chip.active.done {
  background: var(--success);
  color: white;
  border-color: var(--success);
}

.chip.active.done .check { color: white; }

/* Student has a cloud draft (started but not yet saved as a report) */
.chip.drafted {
  border-color: rgba(201, 162, 39, 0.55);
  background: rgba(201, 162, 39, 0.10);
}
.chip.drafted .draft-mark { color: #b8860b; font-size: 12px; }
.chip.active.drafted .draft-mark { color: white; }
.action-bar-status.cloud { color: var(--success); }
.action-bar-status.error { color: var(--danger); }

/* Traditional-Chinese learner indicator on student chips */
.trad-badge {
  display: inline-block;
  margin-left: 6px;
  padding: 0 5px;
  font-family: var(--cn);
  font-size: 10px;
  line-height: 1.6;
  color: var(--gold-deep);
  background: rgba(200, 150, 46, 0.12);
  border: 1px solid rgba(200, 150, 46, 0.35);
  border-radius: 4px;
  letter-spacing: 0;
}
.chip.active .trad-badge {
  color: var(--cream);
  background: rgba(248, 245, 240, 0.18);
  border-color: rgba(248, 245, 240, 0.4);
}

/* Banner shown in the form when a traditional-Chinese learner is selected */
.trad-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  margin-bottom: 18px;
  background: linear-gradient(90deg, rgba(200,150,46,0.10), rgba(200,150,46,0.04));
  border: 1px solid rgba(200, 150, 46, 0.35);
  border-radius: 6px;
  font-family: var(--sans);
  font-size: 12.5px;
  color: var(--ink);
}
.trad-banner .trad-banner-mark {
  font-family: var(--cn);
  font-size: 16px;
  color: var(--gold-deep);
  font-weight: 600;
  letter-spacing: 0.05em;
}
.trad-banner .trad-banner-text {
  flex: 1;
}
.trad-banner .trad-banner-text .lbl {
  font-family: var(--display);
  font-style: italic;
  color: var(--gold-deep);
  margin-right: 6px;
}
.trad-banner .trad-banner-text .sub {
  color: var(--ink-soft);
  font-size: 11.5px;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-muted);
}

.empty-state-title {
  font-family: var(--display);
  font-style: italic;
  font-size: 22px;
  color: var(--ink-soft);
  margin-bottom: 8px;
}

.empty-state-sub {
  font-family: var(--cn);
  font-size: 14px;
}

/* ==========================================================================
   FORM
   ========================================================================== */

.form-shell { display: grid; grid-template-columns: 1fr 380px; gap: 32px; align-items: start; }

@media (max-width: 1080px) {
  .form-shell { grid-template-columns: 1fr; }
}

.form-main {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 36px 40px;
}

.form-section { margin-bottom: 36px; }
.form-section:last-child { margin-bottom: 0; }

.section-head {
  display: flex;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule);
}

.section-head .num {
  font-family: var(--display);
  font-style: italic;
  font-size: 14px;
  color: var(--gold);
  letter-spacing: 0.05em;
}

.section-head .title-cn {
  font-family: var(--cn);
  font-size: 17px;
  font-weight: 500;
  color: var(--navy);
  letter-spacing: 0.05em;
}

.section-head .title-en {
  font-family: var(--display);
  font-style: italic;
  font-weight: 400;
  font-size: 14px;
  color: var(--ink-muted);
  margin-left: auto;
}

.field-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px 24px;
}

.field-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.field-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }

@media (max-width: 720px) {
  .field-grid, .field-grid.cols-4, .field-grid.cols-3 { grid-template-columns: 1fr 1fr; }
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-label {
  font-family: var(--cn);
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-soft);
  letter-spacing: 0.05em;
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.field-label .en {
  font-family: var(--sans);
  font-size: 10px;
  color: var(--ink-muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 400;
}

.field input,
.field select,
.field textarea {
  font-family: var(--sans);
  font-size: 14px;
  color: var(--ink);
  background: var(--cream);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 9px 12px;
  width: 100%;
  transition: border-color 0.2s, background 0.2s;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  outline: none;
  border-color: var(--gold);
  background: var(--paper);
}

.field input[type="number"] { font-feature-settings: 'tnum'; }

.field-readonly {
  font-family: var(--cn);
  font-size: 15px;
  font-weight: 500;
  color: var(--navy);
  padding: 9px 0;
  border-bottom: 1px solid var(--rule);
}

/* Past reports panel (section 01b) */
.past-reports { margin-top: 14px; }
.past-reports-head {
  display: flex; align-items: baseline; gap: 10px;
  font-family: var(--cn); font-size: 13px; font-weight: 500; color: var(--ink-soft);
  margin-bottom: 8px;
}
.past-reports-head .en { font-family: var(--display); font-style: italic; color: var(--ink-muted); font-size: 12px; }
.past-reports-head .count {
  margin-left: auto; font-family: var(--display); font-style: italic; font-size: 12px; color: var(--gold-deep);
}
.past-reports-list { display: flex; flex-direction: column; gap: 6px; }
.past-report-row {
  display: grid; grid-template-columns: 1fr auto auto auto; gap: 14px; align-items: center;
  padding: 8px 12px; background: var(--cream-warm); border-radius: 8px;
  font-size: 13px; color: var(--ink-soft);
}
.past-report-row .unit { font-family: var(--cn); font-weight: 500; color: var(--navy); }
.past-report-row .teacher { font-family: var(--cn); }
.past-report-row .date { font-family: var(--display); font-style: italic; color: var(--ink-muted); font-size: 12px; }
.past-report-row a.open {
  font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--gold-deep);
  text-decoration: none; padding: 4px 10px; border: 1px solid var(--gold-soft); border-radius: 999px; white-space: nowrap;
}
.past-report-row a.open:hover { background: var(--gold); color: #fff; border-color: var(--gold); }
.past-reports-empty, .past-reports-note {
  font-family: var(--cn); font-size: 12.5px; color: var(--ink-muted); padding: 8px 12px;
  background: var(--cream-warm); border-radius: 8px;
}
.past-reports-note b { color: var(--ink-soft); font-weight: 500; }
@media (max-width: 640px) {
  .past-report-row { grid-template-columns: 1fr auto; }
  .past-report-row .teacher, .past-report-row .date { display: none; }
}

.field-readonly .meta {
  font-family: var(--display);
  font-style: italic;
  font-size: 12px;
  color: var(--ink-muted);
  margin-left: 10px;
  font-weight: 400;
}

textarea.comment-area {
  min-height: 160px;
  resize: vertical;
  line-height: 1.7;
  font-family: var(--cn);
  font-size: 14px;
}

textarea.comment-area-en {
  font-family: var(--display);
  font-style: italic;
  font-size: 14px;
}

/* Auto-translation status line, sits directly under each comment textarea */
.translate-status {
  font-family: var(--display);
  font-style: italic;
  font-size: 11.5px;
  color: var(--ink-muted);
  letter-spacing: 0.02em;
  min-height: 16px;
  opacity: 0;
  transition: opacity 0.25s ease;
  margin-top: 2px;
}
.translate-status.show { opacity: 1; }
.translate-status.loading { color: var(--gold-deep); }
.translate-status.loading::before {
  content: '⟳ ';
  display: inline-block;
  animation: tr-spin 0.8s linear infinite;
  margin-right: 2px;
}
.translate-status.success { color: var(--success); }
.translate-status.error   { color: var(--danger); }
@keyframes tr-spin { to { transform: rotate(360deg); } }

/* ==========================================================================
   TAG PICKER (right side)
   ========================================================================== */

.tag-panel {
  background: var(--navy);
  color: var(--cream);
  border-radius: 4px;
  padding: 28px 28px;
  position: sticky;
  top: 100px;
  /* Cap the panel height so it sits inside the viewport
     above the fixed action bar. */
  max-height: calc(100vh - 200px);
  overflow-y: auto;
}

@media (max-width: 1080px) {
  /* When the layout collapses to one column, drop the sticky behaviour
     so the panel doesn't fight with the fixed action bar. */
  .tag-panel {
    position: static;
    max-height: none;
  }
}

.tag-panel-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 4px;
}

.tag-panel-title {
  font-family: var(--display);
  font-style: italic;
  font-weight: 600;
  font-size: 22px;
  color: var(--gold);
  letter-spacing: -0.01em;
}

.tag-panel-sub {
  font-family: var(--cn);
  font-size: 12px;
  color: rgba(248,245,240,0.7);
  letter-spacing: 0.1em;
  margin-bottom: 22px;
}

.tag-category { margin-bottom: 22px; }

.tag-category-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.tag-category-label {
  font-family: var(--cn);
  font-size: 12px;
  font-weight: 500;
  color: var(--gold-soft);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.tag-add-btn {
  background: none;
  border: none;
  color: rgba(248,245,240,0.5);
  font-size: 18px;
  cursor: pointer;
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  transition: all 0.2s;
}

.tag-add-btn:hover { color: var(--gold); background: rgba(200,150,46,0.1); }

.tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tag {
  background: rgba(248,245,240,0.06);
  border: 1px solid rgba(248,245,240,0.15);
  border-radius: 100px;
  padding: 5px 12px 5px 12px;
  font-family: var(--cn);
  font-size: 12px;
  color: var(--cream);
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  position: relative;
}

.tag:hover {
  background: rgba(248,245,240,0.12);
  border-color: rgba(248,245,240,0.3);
}

.tag.selected {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--navy);
  font-weight: 500;
}

.tag-remove {
  display: none;
  font-size: 10px;
  margin-left: 2px;
  opacity: 0.5;
}

.tag.edit-mode .tag-remove { display: inline; }
.tag.edit-mode { cursor: default; }
.tag.edit-mode .tag-remove { cursor: pointer; padding-left: 4px; }
.tag.edit-mode .tag-remove:hover { opacity: 1; color: var(--danger); }

.tag-empty {
  font-family: var(--display);
  font-style: italic;
  font-size: 12px;
  color: rgba(248,245,240,0.4);
}

.tag-edit-toggle {
  background: none;
  border: 1px solid rgba(248,245,240,0.2);
  color: rgba(248,245,240,0.6);
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.2s;
}

.tag-edit-toggle:hover { color: var(--gold); border-color: var(--gold); }
.tag-edit-toggle.active { color: var(--gold); border-color: var(--gold); }

.gen-btn {
  width: 100%;
  background: var(--gold);
  color: var(--navy);
  border: none;
  padding: 14px 16px;
  font-family: var(--display);
  font-style: italic;
  font-weight: 600;
  font-size: 16px;
  border-radius: 3px;
  cursor: pointer;
  margin-top: 10px;
  letter-spacing: 0.01em;
  transition: all 0.2s;
}

.gen-btn:hover { background: var(--gold-soft); transform: translateY(-1px); }
.gen-btn:active { transform: translateY(0); }
.gen-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.shuffle-btn {
  width: 100%;
  background: transparent;
  color: var(--navy);
  border: 1px dashed var(--gold-soft);
  padding: 10px 14px;
  font-family: var(--cn);
  font-size: 13px;
  border-radius: 3px;
  cursor: pointer;
  margin-top: 12px;
  transition: all 0.2s;
}
.shuffle-btn:hover { background: var(--cream-warm); border-style: solid; }
.shuffle-btn .en { font-family: var(--display); font-style: italic; color: var(--ink-muted); margin-left: 6px; font-size: 12px; }

.tag-input-row {
  display: none;
  gap: 6px;
  margin-bottom: 8px;
}

.tag-input-row.show { display: flex; }

.tag-input-row input {
  flex: 1;
  background: rgba(248,245,240,0.08);
  border: 1px solid rgba(248,245,240,0.2);
  color: var(--cream);
  border-radius: 3px;
  padding: 6px 10px;
  font-family: var(--cn);
  font-size: 12px;
}

.tag-input-row input:focus { outline: none; border-color: var(--gold); }
.tag-input-row input::placeholder { color: rgba(248,245,240,0.4); }

.tag-input-row button {
  background: var(--gold);
  color: var(--navy);
  border: none;
  padding: 6px 10px;
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border-radius: 3px;
  cursor: pointer;
}

/* ==========================================================================
   ACTION BAR
   ========================================================================== */

.action-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 16px 28px;
  background: var(--paper);
  border-top: 1px solid var(--rule);
  box-shadow: 0 -2px 12px rgba(26, 39, 68, 0.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

/* When a form is showing, leave room at the bottom so content
   never gets hidden under the fixed action bar. */
body.has-action-bar { padding-bottom: 96px; }

@media (max-width: 720px) {
  .action-bar {
    padding: 12px 16px;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }
  .action-bar-status {
    text-align: center;
    font-size: 12px;
  }
  body.has-action-bar { padding-bottom: 160px; }
}

.action-bar-status {
  font-family: var(--display);
  font-style: italic;
  font-size: 13px;
  color: var(--ink-muted);
}

.action-bar-status.saving { color: var(--gold-deep); }
.action-bar-status.saved { color: var(--success); }

.action-buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

@media (max-width: 720px) {
  .action-buttons { justify-content: stretch; }
  .action-buttons .btn { flex: 1; min-width: 0; padding: 11px 8px; font-size: 12px; }
}

.btn {
  font-family: var(--sans);
  font-weight: 500;
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 11px 22px;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
}

.btn-ghost {
  background: transparent;
  color: var(--navy);
  border-color: var(--rule);
}

.btn-ghost:hover { border-color: var(--navy); background: var(--cream); }

.btn-secondary {
  background: var(--cream-warm);
  color: var(--navy);
  border-color: var(--rule);
}

.btn-secondary:hover { background: var(--cream-deep); }

.btn-primary {
  background: var(--navy);
  color: var(--cream);
}

.btn-primary:hover { background: var(--navy-soft); transform: translateY(-1px); }

.btn-gold {
  background: var(--gold);
  color: var(--navy);
}

.btn-gold:hover { background: var(--gold-soft); transform: translateY(-1px); }

.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

/* ==========================================================================
   TOAST
   ========================================================================== */

.toast-container {
  position: fixed;
  bottom: 32px;
  right: 32px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}

.toast {
  background: var(--navy);
  color: var(--cream);
  padding: 14px 20px;
  border-radius: 3px;
  font-family: var(--sans);
  font-size: 13px;
  letter-spacing: 0.04em;
  box-shadow: 0 12px 32px rgba(11,18,32,0.25);
  min-width: 240px;
  pointer-events: auto;
  animation: toastIn 0.3s cubic-bezier(0.2, 0.7, 0.3, 1);
  border-left: 3px solid var(--gold);
}

.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--danger); }
.toast .title { font-family: var(--display); font-style: italic; font-weight: 600; margin-bottom: 2px; }
.toast .body { font-size: 12px; color: rgba(248,245,240,0.75); }

@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ==========================================================================
   LOADING
   ========================================================================== */

.loading {
  text-align: center;
  padding: 80px 20px;
}

.loading-mark {
  display: inline-block;
  font-family: var(--display);
  font-style: italic;
  font-size: 48px;
  font-weight: 600;
  color: var(--gold);
  animation: pulse 1.4s ease-in-out infinite;
}

.loading-text {
  font-family: var(--cn);
  font-size: 13px;
  color: var(--ink-muted);
  margin-top: 12px;
  letter-spacing: 0.1em;
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* ==========================================================================
   REPORT (used in print window) — definition kept here for in-app preview if needed
   ========================================================================== */

.report-paper {
  width: 8.5in;
  min-height: 11in;
  background: var(--paper);
  padding: 0.6in 0.7in;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  color: var(--ink);
  font-family: var(--sans);
}

.report-watermark {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
  z-index: 0;
}

.report-watermark span {
  font-family: var(--display);
  font-style: italic;
  font-weight: 700;
  font-size: 220px;
  color: var(--navy);
  opacity: 0.04;
  letter-spacing: -0.02em;
  transform: rotate(-18deg);
  white-space: nowrap;
}

.report-content { position: relative; z-index: 1; }

.report-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;

  border-bottom: 2px solid var(--navy);
  margin-bottom: 8px;
}

.report-logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.report-logo-mark {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: var(--gold);
  display: grid;
  place-items: center;
  font-family: var(--display);
  font-style: italic;
  font-weight: 700;
  color: var(--navy);
  font-size: 22px;
}

.report-logo-text { line-height: 1.1; }
.report-logo-text .en {
  font-family: var(--display);
  font-style: italic;
  font-weight: 700;
  font-size: 17px;
  color: var(--navy);
  letter-spacing: -0.01em;
}
.report-logo-text .cn {
  font-family: var(--cn);
  font-size: 11px;
  color: var(--ink-soft);
  letter-spacing: 0.08em;
  margin-top: 2px;
}

.report-address {
  text-align: right;
  font-family: var(--sans);
  font-size: 10px;
  color: var(--ink-soft);
  line-height: 1.5;
  letter-spacing: 0.04em;
}

.report-title-block {
  text-align: center;
  margin: 26px 0 22px;
}

.report-title {
  font-family: var(--display);
  font-style: italic;
  font-weight: 700;
  font-size: 38px;
  color: var(--navy);
  letter-spacing: -0.01em;
  line-height: 1.1;
}

.report-title-cn {
  font-family: var(--cn);
  font-size: 13px;
  color: var(--gold-deep);
  letter-spacing: 0.3em;
  margin-top: 6px;
}

.report-rule { width: 64px; height: 1px; background: var(--gold); margin: 14px auto 0; }

.report-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 24px;
  padding: 12px 0 16px;
  border-bottom: 1px solid var(--rule);

}

.report-info-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 12px;
}

.report-info-row .label {
  font-family: var(--cn);
  color: var(--ink-soft);
  letter-spacing: 0.05em;
  flex-shrink: 0;
}

.report-info-row .label .en {
  font-family: var(--sans);
  font-size: 9px;
  text-transform: uppercase;
  color: var(--ink-muted);

}

.report-info-row .val {
  font-family: var(--cn);
  font-weight: 500;
  color: var(--navy);
  border-bottom: 1px dotted var(--rule);
  flex: 1;
  padding-bottom: 1px;
}

.report-table-block { margin-bottom: 14px; }

.report-table-title {
  font-family: var(--cn);
  font-size: 12px;
  font-weight: 500;
  color: var(--navy);
  letter-spacing: 0.1em;
  margin-bottom: 6px;
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.report-table-title::before {
  content: '';
  width: 12px;
  height: 1px;
  background: var(--gold);
}

.report-table-title .en {
  font-family: var(--display);
  font-style: italic;
  font-size: 11px;
  color: var(--ink-muted);
  font-weight: 400;
  letter-spacing: 0.04em;
}

.report-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  table-layout: fixed;
}

.report-table th,
.report-table td {
  border: 1px solid var(--rule);
  padding: 7px 8px;
  text-align: center;
  vertical-align: middle;
}

.report-table th {
  background: var(--cream-warm);
  font-family: var(--cn);
  font-weight: 500;
  color: var(--navy);
  letter-spacing: 0.04em;

}

.report-table th .en {
  display: block;

  font-style: italic;

.report-table td {

}

.report-table td.num { font-family: var(--sans); font-feature-settings: 'tnum'; }

.report-comment-box {

  border-radius: 2px;

  margin-top: 8px;

.report-comment-label {
  font-family: var(--cn);
  font-size: 12px;
  font-weight: 500;

.report-comment-label .en {
  font-family: var(--display);
  font-style: italic;
  font-size: 11px;
  color: var(--ink-muted);
  font-weight: 400;
}

.report-comment-cn {
  font-family: var(--cn);
  font-size: 12px;
  color: var(--ink);
  line-height: 1.85;
  margin-bottom: 10px;

}

.report-comment-divider {
  width: 28px;
  height: 1px;
  background: var(--gold);

}

.report-comment-en {
  font-family: var(--display);
  font-style: italic;
  font-size: 11.5px;
  color: var(--ink-soft);

}

.report-footer {
  margin-top: 22px;
  padding-top: 14px;

.report-sig {

.report-sig-line {

  font-size: 13px;
  color: var(--ink);

.diagnostic-title {

  font-style: italic;
  font-weight: 600;
  font-size: 22px;
  color: var(--navy);

.diagnostic-body code {

.diagnostic-body strong { color: var(--navy); }

.debug-fab {
  position: fixed;
  bottom: 16px;
  left: 16px;
  z-index: 999;
  background: rgba(20,30,48,0.7);

  border: none;
  border-radius: 100px;
  padding: 6px 14px;
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.15em;

@keyframes slideUp {

}
.dbg-header {

.dbg-header button {

const DEBUG_LOG = [];
function dlog(label, payload) {
  const entry = { t: new Date().toLocaleTimeString(), label, payload };
  DEBUG_LOG.push(entry);
  if (DEBUG_LOG.length > 50) DEBUG_LOG.shift();
  console.log('[MSLC]', label, payload);
  renderDebugPanel();
}

function renderDebugPanel() {
  const el = document.getElementById('debugPanel');
  if (!el) return;
  if (!DEBUG_LOG.length) { el.style.display = 'none'; return; }
  const body = document.getElementById('debugBody');
  body.innerHTML = DEBUG_LOG.slice().reverse().map(e => {
    let p = e.payload;
    if (typeof p === 'object') {
      try { p = JSON.stringify(p, null, 2); } catch { p = String(p); }
    }
    return `<div class="dbg-row"><span class="dbg-t">${escapeHtml(e.t)}</span> <strong>${escapeHtml(e.label)}</strong><pre>${escapeHtml(String(p).slice(0, 2000))}</pre></div>`;
  }).join('');
}

function toggleDebug() {
  const el = document.getElementById('debugPanel');
  el.classList.toggle('open');
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function debounce(fn, ms) {
  let t;
  return function(...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}

/**
 * Normalize a level string so 'Level 2', '二年级', '2', '2nd' all collapse
 * to the same canonical key.
 */
function normalizeLevel(level) {
  if (level == null) return '';
  let s = String(level).trim();
  if (!s) return '';
  s = s.toLowerCase();

  // TK / Pre-K / Kindergarten
  if (/\btk\b|pre[-\s]?k|pre[-\s]?kinder/.test(s)) return 'TK';
  if (/\bk\b|kinder|幼[儿兒]园|幼[儿兒]園|幼[稚兒]园|幼[稚兒]園/.test(s)) return 'K';

  // Chinese numerals followed by 年级/年級/级/級 (handles "二年级", "二级", "中文二级")
  const zhNum = { '一':'1','二':'2','两':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9','十':'10' };
  for (const [zh, ar] of Object.entries(zhNum)) {
    if (new RegExp(zh + '\\s?[年級级]').test(s)) return ar;
  }

  // Arabic numerals anywhere (Level 2, 2nd, 2, Grade 2, G2, Beginner 1, Chinese 2, L2)
  const m = s.match(/(\d+)/);
  if (m) return m[1];

  // Fallback: bare Chinese numeral (e.g. value is just "一" or "二")
  for (const [zh, ar] of Object.entries(zhNum)) {
    if (s.includes(zh)) return ar;
  }

  return s;
}

function studentLevel(student) {
  // We filter by Chinese Level per spec
  return normalizeLevel(student['Chinese Level']);
}

/**
 * Human-readable label for a normalized Chinese Level key.
 * Used in the student strip group headers so teachers can see at a glance
 * which group each chip belongs to.
 */
function levelDisplayName(normalizedLevel) {
  const map = {
    'TK': 'TK · Pre-K',
    'K':  'K · Kindergarten',
    '1':  '一年级 · Grade 1',
    '2':  '二年级 · Grade 2',
    '3':  '三年级 · Grade 3',
    '4':  '四年级 · Grade 4',
    '5':  '五年级 · Grade 5',
    '6':  '六年级 · Grade 6',
    '7':  '七年级 · Grade 7',
    '8':  '八年级 · Grade 8'
  };
  return map[normalizedLevel] || normalizedLevel;
}

function studentMatchesTeacher(student, teacher) {
  if (!teacher.grades.length) return false;
  const status = String(student.Status || '').trim().toLowerCase();
  if (status === 'inactive' || status === 'hidden') return false;
  const lvl = studentLevel(student);
  return teacher.grades.some(g => normalizeLevel(g) === lvl);
}

/**
 * Pick the first non-empty value from a list of possible keys.
 * The Apps Script returns students in different shapes depending on which
 * endpoint version is deployed:
 *   - older getStudents → { students: [{ name, school, grade, chineseLevel, status }] }
 *   - newer tpGetStudents → { success: true, data: [{ "Student Name", "Chinese Level", ... }] }
 * Plus the unwrap might be at top level. This handles all of it.
 */
function pickField(obj, ...keys) {
  for (const k of keys) {
    if (obj && obj[k] != null && String(obj[k]).trim() !== '') return obj[k];
  }
  return '';
}

function normalizeStudent(s) {
  return {
    'Student Name':  pickField(s, 'Student Name', 'name', 'Name', 'studentName'),
    'School Name':   pickField(s, 'School Name', 'school', 'School', 'schoolName'),
    'Current Grade': pickField(s, 'Current Grade', 'grade', 'Grade', 'currentGrade'),
    'Chinese Level': pickField(s, 'Chinese Level', 'chineseLevel', 'ChineseLevel', 'chinese_level'),
    'Math Level':    pickField(s, 'Math Level', 'mathLevel', 'MathLevel', 'math_level'),
    'Status':        pickField(s, 'Status', 'status') || 'Active',
    'script':        pickField(s, 'script', 'Script')
  };
}

function unwrapStudentsResponse(r) {
  if (Array.isArray(r)) return r;
  if (r && Array.isArray(r.students)) return r.students;
  if (r && Array.isArray(r.data)) return r.data;
  if (r && r.success && Array.isArray(r.result)) return r.result;
  return [];
}

/**
 * Normalize a column key: lowercase + strip spaces, underscores, hyphens
 * so 'Student Name', 'studentName', 'student_name', 'STUDENTNAME' all collide.
 */
function normKey(k) {
  return String(k || '').toLowerCase().replace(/[\s_\-]/g, '');
}

/**
 * Defensive accessor: looks up a value in a student record using any of
 * several possible column-name spellings. Returns '' if nothing matches.
 */
function pick(obj, ...candidates) {
  if (!obj) return '';
  const wanted = new Set(candidates.map(normKey));
  for (const [k, v] of Object.entries(obj)) {
    if (wanted.has(normKey(k))) return v == null ? '' : v;
  }
  return '';
}

/**
 * Normalize a raw student record from the API into the canonical shape the
 * rest of the app expects ('Student Name', 'Chinese Level', etc), while
 * also preserving every original key for inspection.
 */
function normalizeStudent(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const out = { ...raw };
  out['Student Name']  = pick(raw, 'Student Name', 'studentName', 'name', 'StudentName', '学生姓名', '姓名');
  out['School Name']   = pick(raw, 'School Name', 'school', 'schoolName', 'SchoolName', '学校');
  out['Current Grade'] = pick(raw, 'Current Grade', 'grade', 'currentGrade', 'Grade', '年级', '在校年级');
  out['Math Level']    = pick(raw, 'Math Level', 'mathLevel', 'MathLevel', '数学程度', '数学级别');
  out['Chinese Level'] = pick(raw, 'Chinese Level', 'chineseLevel', 'ChineseLevel', '中文程度', '中文级别');
  out['Status']        = pick(raw, 'Status', 'status', '状态');
  // Trim stray whitespace from the sheet (names are keys for saving/tracking)
  for (const k of ['Student Name', 'School Name', 'Current Grade', 'Chinese Level', 'Status']) {
    if (typeof out[k] === 'string') out[k] = out[k].trim();
  }
  // Traditional-script learners: a "*" in the name marks them in the sheet,
  // unless listed in SIMPLIFIED_DESPITE_STAR. An explicit script field wins.
  if (!out.script) out.script = detectScript(out['Student Name']);
  return out;
}

/**
 * Students whose name carries a "*" in the sheet but who now learn
 * simplified characters. Match on the English part of the name.
 */
const SIMPLIFIED_DESPITE_STAR = ['Donovan Wang', 'Beckett Wang'];

function englishNameKey(name) {
  // "Zachary Wu *(吴哲立)" → "zachary wu"; "Theodore Zhang(刘昊谦）" → "theodore zhang"
  return String(name || '').split(/[\(（]/)[0].replace(/\*/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
}

function detectScript(name) {
  if (!name || name.indexOf('*') < 0) return '';
  const key = englishNameKey(name);
  if (SIMPLIFIED_DESPITE_STAR.some(n => englishNameKey(n) === key)) return '';
  return 'traditional';
}

/**
 * The existing API might return students as: an array, {students: [...]},
 * {data: [...]}, {result: [...]}, or {rows: [...]}. Unwrap to a flat array.
 */
function extractList(resp, ...preferredKeys) {
  if (Array.isArray(resp)) return resp;
  if (!resp || typeof resp !== 'object') return [];
  for (const k of preferredKeys) {
    if (Array.isArray(resp[k])) return resp[k];
  }
  // fallback: first array-valued property in the object
  for (const v of Object.values(resp)) {
    if (Array.isArray(v)) return v;
  }
  return [];
}

function toast(title, body, kind) {
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.innerHTML = `<div class="title">${escapeHtml(title)}</div>` + (body ? `<div class="body">${escapeHtml(body)}</div>` : '');

/* ==========================================================================
   API
   ========================================================================== */

async function apiGet(action, params) {
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  if (params) for (const [k,v] of Object.entries(params)) url.searchParams.set(k, v);
  const r = await fetch(url.toString(), { method: 'GET', credentials: 'omit' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  if (data && data.error) throw new Error(data.error);
  return data;
}

async function apiPost(action, payload) {
  // Apps Script: must use Content-Type: text/plain to avoid CORS preflight
  const body = JSON.stringify(Object.assign({ action }, payload));
  const r = await fetch(API_URL, {
    method: 'POST',
    credentials: 'omit',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  if (data && data.error) throw new Error(data.error);
  return data;
}

function useEmbeddedRoster(reason) {
  dlog('[Home] Using EMBEDDED_ROSTER (' + EMBEDDED_ROSTER.length + ' students) — ' + reason);
  state.studentsCache = EMBEDDED_ROSTER.map(normalizeStudent).filter(s => s && s['Student Name']);
  state.rosterSource = 'embedded';
  populateCardCounts();
  showHomeBanner('名单来自离线备份 · Roster loaded from offline backup',
    '无法从 Google 表格读取学生名单（' + reason + '），已改用网页内置的备份名单（' + EMBEDDED_ROSTER.length + ' 人，2026-10-30 快照）。如果表格里有新学生，请刷新页面重试。',
    'warn');
}

async function prefetchStudents() {
  // ─── Path A: Google Sheet via Apps Script (source of truth) ───
  //   tpGetStudents (newer endpoint) → legacy getStudents (always deployed,
  //   shared with the Assignment Tracker). Either returns the live roster.
  // ─── Path B: EMBEDDED_ROSTER snapshot, only if the API is unreachable ───
  try {
    let resp = await apiGet('tpGetStudents').catch(e => { dlog('[Home] tpGetStudents failed', e.message); return null; });
    let rawList = extractList(resp, 'students', 'data', 'rows', 'result');

    // Fallback to legacy getStudents (used by your existing checkout site)
    if (!rawList || rawList.length === 0) {
      dlog('[Home] Trying legacy getStudents');
      const legacy = await apiGet('getStudents').catch(e => { dlog('[Home] getStudents failed', e.message); return null; });
      rawList = extractList(legacy, 'students', 'data', 'rows', 'result');
    }

    const fromApi = (rawList || []).map(normalizeStudent).filter(s => s && s['Student Name']);
    dlog(`[Home] Loaded ${fromApi.length} students from API`);

    if (fromApi.length === 0) {
      if (Array.isArray(EMBEDDED_ROSTER) && EMBEDDED_ROSTER.length > 0) {
        useEmbeddedRoster('API 返回 0 位学生');
      } else {
        showHomeBanner('No students loaded',
          'API returned no students AND EMBEDDED_ROSTER is empty. Check that the Apps Script web app is deployed (Deploy → Manage deployments → New version) and that the "Students" tab has data.',
          'error');
      }
      return;
    }

    state.studentsCache = fromApi;
    state.rosterSource = 'api';
    populateCardCounts();
  } catch (e) {
    dlog('[Home] prefetchStudents FATAL', e.message);
    if (Array.isArray(EMBEDDED_ROSTER) && EMBEDDED_ROSTER.length > 0) {
      useEmbeddedRoster(e.message || 'network error');
      return;
    }
    TEACHERS.forEach(t => {
      const slot = document.querySelector(`[data-count-for="${t.id}"]`);
      if (slot && !t.online) slot.innerHTML = '<span style="color: var(--danger); font-family: var(--display); font-style: italic; font-size: 12px;">— offline —</span>';
    });
    showHomeBanner('Cannot reach API', e.message, 'error');
  }
}

function populateCardCounts() {
  TEACHERS.forEach(t => {
    const slot = document.querySelector(`[data-count-for="${t.id}"]`);
    if (!slot || t.online) return;
    const matches = state.studentsCache.filter(s => studentMatchesTeacher(s, t));
    const n = matches.length;
    slot.innerHTML = `<span class="count-pill ${n === 0 ? 'zero' : ''}">${n}</span> <span class="count-label">student${n === 1 ? '' : 's'} · ${n === 0 ? '无匹配' : '已匹配'}</span>`;
  });

  // Diagnostic: all non-online teachers have 0 matches → likely Chinese Level mismatch
  if (state.studentsCache.length > 0) {
    const offlineTeachers = TEACHERS.filter(t => !t.online);
    const allZero = offlineTeachers.every(t => state.studentsCache.filter(s => studentMatchesTeacher(s, t)).length === 0);
    if (allZero) {
      const seenLevels = [...new Set(state.studentsCache.map(s => s['Chinese Level']).filter(Boolean))];
      showHomeBanner(
        `Loaded ${state.studentsCache.length} students but 0 matched any teacher`,
        `Chinese Level values seen: ${seenLevels.slice(0, 10).map(v => `"${v}"`).join(', ')}${seenLevels.length > 10 ? '…' : ''}. Expected: 1 / 2 / 3 / 4 / 5 / 6 / TK / K (or 一年级 / Level 2 / 2nd / Beginner 2 etc).`,
        'error');
    }
  }
}

function showHomeBanner(title, body, kind) {
  const hero = document.querySelector('#view-home .hero');
  if (!hero) return;
  // Remove any existing banner first
  const old = document.getElementById('homeBanner');
  if (old) old.remove();

  banner.innerHTML = `
    <div class="home-banner-title">${escapeHtml(title)}</div>
    <div class="home-banner-body">${escapeHtml(body)}</div>
    <a href="#" onclick="toggleDebug();return false;" class="home-banner-link">▸ Show API debug log</a>
  `;
  hero.appendChild(banner);
}

function goHome() {

  state.selectedStudent = null;

async function enterWorkspace(teacherId) {
  const teacher = TEACHERS.find(t => t.id === teacherId);
  if (!teacher) return;
  state.teacher = teacher;

  document.getElementById('view-home').classList.remove('active');
  document.getElementById('view-workspace').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });

  document.getElementById('wsTitleCn').textContent = teacher.nameCn;
  document.getElementById('wsTitleEn').textContent = teacher.nameEn;
  document.getElementById('wsTitleGrades').textContent = teacher.gradesDisplay;

  // Render shell with loading state
  document.getElementById('studentChips').innerHTML = '<div class="loading"><div class="loading-mark">M</div><div class="loading-text">Loading students · 加载中</div></div>';
  document.getElementById('studentCount').textContent = '';
  document.getElementById('formShell').innerHTML = '';

  // Online teacher: empty state
  if (teacher.online) {
    document.getElementById('studentStrip').innerHTML = `
      <div class="student-strip-head">
        <div class="student-strip-title">本期学生 <span class="en">Students this unit</span></div>
      </div>
      <div class="empty-state">
        <div class="empty-state-title">Online students reported separately</div>
        <div class="empty-state-sub">${teacher.nameCn}负责网课，请直接使用 MSLC report 模板撰写报告。<br>本系统暂不为网课学生分配名单。</div>
      </div>`;
    // still load tag library so the comment generator is usable
    await loadTeacherTags(teacher);
    renderForm(); // empty form
    return;
  }

  // Load students, tags, and completed-list in parallel
  try {
    // Reuse home-page prefetched cache if available, otherwise fetch fresh
    const studentsPromise = (state.studentsCache && state.studentsCache.length)
      ? Promise.resolve({ __cached: true, data: state.studentsCache })
      : prefetchStudents().then(() => ({ __cached: true, data: state.studentsCache }));

    const [studentsResp, tagsResp, completedResp, draftsResp] = await Promise.all([
      studentsPromise,
      apiGet('tpGetTags', { teacher: teacher.nameCn }).catch(e => { dlog('tpGetTags ERROR', e.message); return null; }),
      apiGet('tpGetReportStatus', { teacher: teacher.nameCn, unit: state.unit }).catch(() => null),
      apiGet('tpListDrafts', { teacher: teacher.nameCn, unit: state.unit }).catch(() => null)
    ]);
    state.draftStudents = new Set(extractList(draftsResp, 'students', 'data'));

    dlog('tpGetStudents response (cached=' + !!(studentsResp && studentsResp.__cached) + ')', studentsResp);
    dlog('tpGetTags response', tagsResp);

    // Extract + normalize (or pass through if cached)
    if (studentsResp && studentsResp.__cached) {
      state.students = studentsResp.data;
    } else {
      const rawList = extractList(studentsResp, 'students', 'data', 'rows', 'result');
      state.students = rawList.map(normalizeStudent).filter(Boolean);
    }

    dlog(`Parsed ${state.students.length} students`, state.students.slice(0, 3));

    state.filteredStudents = state.students.filter(s => studentMatchesTeacher(s, teacher));

    dlog(`Matched ${state.filteredStudents.length} for ${teacher.nameCn} (expects ${teacher.grades.join('|')})`,
         state.filteredStudents.map(s => `${s['Student Name']} :: ${s['Chinese Level']}`));

    state.completedStudents = new Set(extractList(completedResp, 'completed', 'students', 'data'));

    // organize tags
    state.tags = { Strengths: [], Improvements: [], Encouragement: [] };
    const tagList = extractList(tagsResp, 'tags', 'data', 'rows');
    tagList.forEach(t => {
      const cat = pick(t, 'Category', 'category');
      if (state.tags[cat]) state.tags[cat].push({
        tagID: pick(t, 'TagID', 'tagID', 'id'),
        tagCn: pick(t, 'TagCN', 'tagCn', 'tagCN', 'cn'),
        tagEn: pick(t, 'TagEN', 'tagEn', 'tagEN', 'en')
      });
    });

    // Fallback to EMBEDDED_TAGS if API returned 0 tags AND we have a starter set
    applyEmbeddedTagsFallback(teacher);

    renderStudentStrip();
    renderForm();
  } catch (e) {
    console.error(e);
    dlog('enterWorkspace ERROR', e.message);
    toast('Failed to load', e.message, 'error');
    document.getElementById('studentChips').innerHTML = `<div class="empty-state"><div class="empty-state-title">Connection error</div><div class="empty-state-sub">${escapeHtml(e.message)}<br><br><a href="#" onclick="toggleDebug();return false;" style="color:var(--gold-deep);">▸ Show debug log</a></div></div>`;
  }
}

async function loadTeacherTags(teacher) {
  try {
    const tagsResp = await apiGet('tpGetTags', { teacher: teacher.nameCn });
    dlog('tpGetTags response (online)', tagsResp);
    state.tags = { Strengths: [], Improvements: [], Encouragement: [] };
    const tagList = extractList(tagsResp, 'tags', 'data', 'rows');
    tagList.forEach(t => {
      const cat = pick(t, 'Category', 'category');
      if (state.tags[cat]) state.tags[cat].push({
        tagID: pick(t, 'TagID', 'tagID', 'id'),
        tagCn: pick(t, 'TagCN', 'tagCn', 'tagCN', 'cn'),
        tagEn: pick(t, 'TagEN', 'tagEn', 'tagEN', 'en')
      });
    });
  } catch (e) {
    console.error(e);
    dlog('tpGetTags ERROR', e.message);
    state.tags = { Strengths: [], Improvements: [], Encouragement: [] };
  }
  // Always try embedded fallback after API attempt
  applyEmbeddedTagsFallback(teacher);
}

/**
 * If the API returned 0 tags total but EMBEDDED_TAGS has a starter set
 * for this teacher, seed state.tags with the embedded library.
 * Embedded tags are marked seedOnly so the UI can show them as read-only.
 */
function applyEmbeddedTagsFallback(teacher) {
  const totalApiTags = state.tags.Strengths.length + state.tags.Improvements.length + state.tags.Encouragement.length;
  if (totalApiTags > 0) return;  // teacher has API tags, don't override
  const seed = EMBEDDED_TAGS[teacher.nameCn];
  if (!seed) return;
  dlog('Applying EMBEDDED_TAGS fallback for ' + teacher.nameCn);
  for (const cat of ['Strengths', 'Improvements', 'Encouragement']) {
    (seed[cat] || []).forEach(t => {
      state.tags[cat].push({
        tagID: t.TagID,
        tagCn: t.TagCN,
        tagEn: t.TagEN,
        seedOnly: true
      });
    });
  }
}

/* ==========================================================================
   RENDER: STUDENT STRIP
   ========================================================================== */

function renderStudentStrip() {
  const strip = document.getElementById('studentChips');
  if (!state.filteredStudents.length) {
    // Build a useful diagnostic: what came back, and what we tried to match against
    const totalLoaded = state.students.length;
    const seenLevelsRaw = [...new Set(state.students.map(s => s['Chinese Level']))].filter(v => v != null && v !== '');
    const seenLevelsNorm = [...new Set(state.students.map(s => normalizeLevel(s['Chinese Level'])))].filter(Boolean);
    const expectedNorm = state.teacher.grades.map(normalizeLevel);

    let reason;
    if (totalLoaded === 0) {
      reason = `<strong>API returned 0 students.</strong><br>检查 Apps Script 端 <code>tpGetStudents</code> 是否部署、CORS 是否允许、以及 sheet 是否有数据。`;
    } else {
      reason = `共加载了 <strong>${totalLoaded}</strong> 个学生，但没有一个的 Chinese Level 匹配 <strong>${escapeHtml(state.teacher.gradesDisplay)}</strong>。
        <br><br>
        <span style="font-family: var(--display); font-style: italic; color: var(--ink-soft);">Expected (normalized):</span>
        <code>${expectedNorm.map(escapeHtml).join(' / ') || '—'}</code>
        <br>
        <span style="font-family: var(--display); font-style: italic; color: var(--ink-soft);">Seen in data (raw):</span>
        <code>${seenLevelsRaw.map(v => escapeHtml(String(v))).join(' · ') || '—'}</code>
        <br>
        <span style="font-family: var(--display); font-style: italic; color: var(--ink-soft);">Seen (normalized):</span>
        <code>${seenLevelsNorm.map(escapeHtml).join(' · ') || '—'}</code>`;
    }

    strip.innerHTML = `<div class="diagnostic">
      <div class="diagnostic-title">没有匹配的学生 · No students matched</div>
      <div class="diagnostic-body">${reason}</div>
      <div style="margin-top: 14px;"><a href="#" onclick="toggleDebug();return false;" style="color:var(--gold-deep); font-family: var(--sans); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;">▸ Show API debug log</a></div>
    </div>`;
    document.getElementById('studentCount').textContent = totalLoaded ? `0 / ${totalLoaded} matched` : '';
    return;
  }

  // Group students by normalized Chinese Level, ordered by teacher.grades sequence
  const levelOrder = state.teacher.grades.map(normalizeLevel);
  const byLevel = new Map();
  for (const lvl of levelOrder) byLevel.set(lvl, []);
  for (const s of state.filteredStudents) {
    const norm = normalizeLevel(s['Chinese Level']);
    if (byLevel.has(norm)) byLevel.get(norm).push(s);
    else { // student level didn't match any teacher.grades — put in an "other" bucket at end
      if (!byLevel.has('_other')) byLevel.set('_other', []);
      byLevel.get('_other').push(s);
    }
  }

  // Sort within each group: completed last, then alphabetical
  const sortFn = (a, b) => {
    const ad = state.completedStudents.has(a['Student Name']) ? 1 : 0;
    const bd = state.completedStudents.has(b['Student Name']) ? 1 : 0;
    if (ad !== bd) return ad - bd;
    return String(a['Student Name']).localeCompare(String(b['Student Name']), 'zh');
  };

  const renderChip = (s) => {
    const done = state.completedStudents.has(s['Student Name']);
    const hasDraft = !done && state.draftStudents.has(s['Student Name']);
    const active = state.selectedStudent && state.selectedStudent['Student Name'] === s['Student Name'];
    const isTrad = s.script === 'traditional';
    return `<div class="chip ${done ? 'done' : ''} ${hasDraft ? 'drafted' : ''} ${active ? 'active' : ''} ${isTrad ? 'trad' : ''}" data-student="${escapeHtml(s['Student Name'])}">
      ${done ? '<span class="check">✓</span>' : (hasDraft ? '<span class="draft-mark" title="有未完成的草稿 · Draft saved">✎</span>' : '')}${escapeHtml(s['Student Name'])}${isTrad ? '<span class="trad-badge" title="Traditional Chinese learner · 繁體中文学习者">繁</span>' : ''}
    </div>`;
  };

  // If only one non-empty group, render as a flat strip (no section header needed)
  const nonEmptyGroups = [...byLevel.entries()].filter(([_, students]) => students.length > 0);
  if (nonEmptyGroups.length <= 1) {
    const all = state.filteredStudents.slice().sort(sortFn);
    strip.innerHTML = `<div class="level-chips">${all.map(renderChip).join('')}</div>`;
  } else {
    strip.innerHTML = nonEmptyGroups.map(([level, students]) => {
      const sortedGroup = students.slice().sort(sortFn);
      const label = level === '_other' ? 'Other · 其他' : levelDisplayName(level);
      return `<div class="level-group">
        <div class="level-label">${escapeHtml(label)}<span class="count">${students.length}</span></div>
        <div class="level-chips">${sortedGroup.map(renderChip).join('')}</div>
      </div>`;
    }).join('');
  }

  // Event delegation: handle clicks via data attribute (safe against quotes in names)
  document.getElementById('studentChips').onclick = (e) => {
    const chip = e.target.closest('.chip[data-student]');
    if (chip) selectStudent(chip.getAttribute('data-student'));
  };

  const total = state.filteredStudents.length;
  const doneCount = state.filteredStudents.filter(s => state.completedStudents.has(s['Student Name'])).length;
  document.getElementById('studentCount').textContent = `${doneCount} / ${total} completed`;
}

function selectStudent(name) {
  const stud = state.filteredStudents.find(s => s['Student Name'] === name);
  if (!stud) return;
  // Flush draft for currently-selected student before switching keys
  if (state.selectedStudent && state.selectedStudent['Student Name'] !== name) {
    saveDraft();
  }
  state.selectedStudent = stud;
  state.selectedTags = { Strengths: new Set(), Improvements: new Set(), Encouragement: new Set() };
  renderStudentStrip();
  renderForm();
  // smooth scroll to form
  setTimeout(() => {
    document.getElementById('formShell').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

const pastReportsCache = {};   // englishNameKey → rows

async function loadPastReports(stud) {
  const box = document.getElementById('pastReports');
  if (!box || !stud) return;
  const name = stud['Student Name'] || '';
  const key  = englishNameKey(name);
  const list = box.querySelector('.past-reports-list');
  const cnt  = box.querySelector('.count');

  let rows = pastReportsCache[key];
  if (!rows) {
    try {
      const resp = await apiGet('tpGetStudentReports', { studentName: name });
      rows = extractList(resp, 'reports', 'data', 'rows');
      pastReportsCache[key] = rows;
    } catch (e) {
      dlog('tpGetStudentReports ERROR', e.message);
      // Still the selected student? Otherwise a newer render owns the box.
      if (!state.selectedStudent || state.selectedStudent['Student Name'] !== name) return;
      cnt.textContent = '不可用';
      const notDeployed = /unknown action/i.test(e.message || '');
      list.innerHTML = `<div class="past-reports-note">${notDeployed
        ? '后台 Apps Script 还没有 <b>tpGetStudentReports</b> 这个接口 — 请把新的 Code.gs / Reports.gs 贴进 Apps Script 并重新部署（New version）后，这里就会显示以往的报告。'
        : '暂时无法读取以往报告：' + escapeHtml(e.message || 'network error')}</div>`;
      return;
    }
  }
  if (!state.selectedStudent || state.selectedStudent['Student Name'] !== name) return;

  if (!rows || !rows.length) {
    cnt.textContent = '0 份';
    list.innerHTML = '<div class="past-reports-empty">还没有这位学生的报告记录（第一份就从这里开始）。</div>';
    return;
  }

  // newest first
  rows = rows.slice().sort((a, b) => String(b.timestamp || '').localeCompare(String(a.timestamp || '')));
  cnt.textContent = rows.length + ' 份';
  list.innerHTML = rows.map(r => {
    const when = formatTrackerDate(r.timestamp);
    const url  = r.fileUrl || (r.fileId ? 'https://drive.google.com/file/d/' + r.fileId + '/view' : '');
    const stale = r.matchedName && r.matchedName !== name
      ? ` <span class="date" title="当时登记的名字">(${escapeHtml(r.matchedName)})</span>` : '';
    return `<div class="past-report-row">
      <span class="unit">${escapeHtml(r.unit || '—')}${stale}</span>
      <span class="teacher">${escapeHtml(r.teacher || '')}</span>

    </div>`;
  }).join('');
}

function formatTrackerDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d.getTime())) return String(ts);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function renderTagList(category) {
  const list = state.tags[category] || [];
  if (!list.length) return '<div class="tag-empty">No tags yet · 暂无标签</div>';
  return list.map(t => {
    const sel = state.selectedTags[category].has(t.tagID);
    const removable = state.editMode && !t.seedOnly;
    const seedBadge = t.seedOnly ? '<span style="font-family: var(--display); font-style: italic; font-size: 9px; color: var(--gold-soft); margin-left: 4px; opacity: 0.6;">·seed</span>' : '';
    return `<div class="tag ${sel ? 'selected' : ''} ${state.editMode ? 'edit-mode' : ''}"
                 data-id="${escapeHtml(t.tagID)}"
                 onclick="onTagClick(event, '${category}', '${escapeHtml(t.tagID)}')">
      ${escapeHtml(t.tagCn)}
      <span style="opacity: 0.5; font-size: 10px; margin-left: 2px;">${escapeHtml(t.tagEn || '')}</span>${seedBadge}
      ${removable ? `<span class="tag-remove" onclick="event.stopPropagation(); removeTag('${category}', '${escapeHtml(t.tagID)}')">✕</span>` : ''}
    </div>`;
  }).join('');
}

function onTagClick(ev, category, tagID) {
  if (state.editMode) return;
  ev.stopPropagation();
  if (state.selectedTags[category].has(tagID)) {
    state.selectedTags[category].delete(tagID);
  } else {
    state.selectedTags[category].add(tagID);
  }
  document.getElementById('tagList_' + category).innerHTML = renderTagList(category);
}

/**
 * Random starter combo so reports don't all read the same:
 * 2–3 strengths, 1 improvement, 1 encouragement — different every click.
 * Teachers can still toggle individual tags afterwards.
 */
function randomTagPick() {
  if (state.editMode) return;
  const pickN = (list, n) => {
    const pool = list.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, n).map(t => t.tagID);
  };
  const want = {
    Strengths:     2 + Math.floor(Math.random() * 2),   // 2 or 3
    Improvements:  1,
    Encouragement: 1
  };
  let any = false;
  for (const cat of Object.keys(want)) {
    const list = state.tags[cat] || [];
    state.selectedTags[cat] = new Set(pickN(list, want[cat]));
    if (state.selectedTags[cat].size) any = true;
    const el = document.getElementById('tagList_' + cat);
    if (el) el.innerHTML = renderTagList(cat);
  }
  if (any) toast('Random picks', '已随机选好一组标签，不满意可再点一次或手动调整', 'success');
}

function toggleEditMode() {
  state.editMode = !state.editMode;
  document.getElementById('editToggle').classList.toggle('active', state.editMode);
  document.getElementById('editToggle').textContent = state.editMode ? '完成' : '编辑';

async function addTag(category) {
  const cnEl = document.getElementById('addCn_' + category);
  const enEl = document.getElementById('addEn_' + category);
  const tagCn = cnEl.value.trim();
  const tagEn = enEl.value.trim();
  if (!tagCn) {
    toast('Missing input', '中文标签不能为空', 'error');
    return;
  }
  try {
    const res = await apiPost('tpAddTag', {
      teacher: state.teacher.nameCn,
      category,
      tagCn,
      tagEn
    });
    const newTag = {
      tagID: res.tagID || res.TagID || ('t_' + Date.now()),
      tagCn,
      tagEn
    };
    state.tags[category].push(newTag);
    cnEl.value = ''; enEl.value = '';
    document.getElementById('addRow_' + category).classList.remove('show');
    document.getElementById('tagList_' + category).innerHTML = renderTagList(category);
    toast('Added', `${tagCn}`, 'success');
  } catch (e) {
    toast('Add failed', e.message, 'error');
  }
}

async function removeTag(category, tagID) {
  if (!confirm('删除此标签？此操作不可撤销。')) return;
  try {
    await apiPost('tpRemoveTag', { teacher: state.teacher.nameCn, tagID });
    state.tags[category] = state.tags[category].filter(t => t.tagID !== tagID);
    state.selectedTags[category].delete(tagID);
    document.getElementById('tagList_' + category).innerHTML = renderTagList(category);
    toast('Removed', '', 'success');
  } catch (e) {
    toast('Remove failed', e.message, 'error');
  }
}

function setSaveStatus(s, extra) {
  const el = document.getElementById('saveStatus');
  if (!el) return;
  el.classList.remove('saving','saved','cloud','error');
  if (s === 'saving')      { el.classList.add('saving'); el.textContent = '正在保存草稿… · Saving draft'; }
  else if (s === 'saved')  { el.classList.add('saved');  el.textContent = '✓ 已保存到本机，正在同步云端… · Saved locally, syncing'; }
  else if (s === 'cloud')  { el.classList.add('cloud');  el.textContent = '✓ 草稿已保存到云端 · Draft saved to the cloud' + (extra ? ' · ' + extra : ''); }
  else if (s === 'error')  { el.classList.add('error');  el.textContent = '⚠ 云端保存失败（本机已保存）· Cloud save failed' + (extra ? ' · ' + extra : ''); }
  else el.textContent = '草稿会自动保存到云端 · Drafts auto-save to the cloud';
}

function draftKey() {
  if (!state.teacher || !state.selectedStudent) return null;
  return `mslc-report-draft::${state.teacher.id}::${state.unit}::${state.selectedStudent['Student Name']}`;
}

function saveDraft() {
  const k = draftKey();
  if (!k) return;
  const payload = {
    form: readForm(),
    selectedTags: {
      Strengths: [...state.selectedTags.Strengths],
      Improvements: [...state.selectedTags.Improvements],
      Encouragement: [...state.selectedTags.Encouragement]
    },
    savedAt: new Date().toISOString()
  };
  try { localStorage.setItem(k, JSON.stringify(payload)); } catch (e) { console.warn(e); }
  scheduleCloudSave();
}

/* ── Cloud drafts (ReportDrafts tab via Apps Script) ─────────────────────
   Local storage keeps things instant; the cloud copy is what lets a
   teacher start a report today and finish it (exam scores etc.) later,
   from any computer. Newest copy wins when both exist. */
let cloudSaveTimer = null;
let cloudSaveInflight = null;

function draftIdentity() {
  if (!state.teacher || !state.selectedStudent) return null;
  return { teacher: state.teacher.nameCn, unit: state.unit, studentName: state.selectedStudent['Student Name'] };
}

function draftIsEmpty(payload) {
  const f = payload.form || {};
  const hasText = Object.keys(f).some(id => id !== 'f_date' && String(f[id] || '').trim() !== '');
  const t = payload.selectedTags || {};
  const hasTags = ['Strengths','Improvements','Encouragement'].some(c => (t[c] || []).length > 0);
  return !hasText && !hasTags;
}

function scheduleCloudSave() {
  if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(() => cloudSaveDraft(false), 2500);
}

async function cloudSaveDraft(explicit) {
  const id = draftIdentity();
  const k = draftKey();
  if (!id || !k) return;
  let payload;
  try { payload = JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { payload = null; }
  if (!payload) return;
  if (draftIsEmpty(payload) && !explicit) return;   // nothing worth syncing yet
  const studentName = id.studentName;
  try {
    cloudSaveInflight = apiPost('tpSaveDraft', Object.assign({}, id, { draft: JSON.stringify(payload), updatedAt: payload.savedAt }));
    const r = await cloudSaveInflight;
    if (!r || !(r.ok || r.success)) throw new Error((r && r.error) || 'unknown');
    if (!state.selectedStudent || state.selectedStudent['Student Name'] !== studentName) return;
    if (!state.completedStudents.has(studentName) && !state.draftStudents.has(studentName)) {
      state.draftStudents.add(studentName);
      renderStudentStrip();
    }
    setSaveStatus('cloud', new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }));
    if (explicit) toast('Draft saved', `${studentName} 的草稿已保存到云端，下次打开会自动恢复`, 'success');
  } catch (e) {
    dlog('tpSaveDraft ERROR', e.message);
    if (!state.selectedStudent || state.selectedStudent['Student Name'] !== studentName) return;
    const notDeployed = /unknown.*action/i.test(e.message || '');
    setSaveStatus('error', notDeployed ? '后台需要重新部署 tpSaveDraft' : e.message);
    if (explicit) toast('Cloud save failed', '草稿只保存在本机：' + e.message, 'error');
  } finally {
    cloudSaveInflight = null;
  }
}

function saveDraftNow() {
  if (!state.selectedStudent) { toast('Pick a student', '请先选择一位学生', 'error'); return; }
  if (saveTimer) clearTimeout(saveTimer);
  if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
  saveDraft();          // local first (also schedules a cloud save, which we cancel below)
  if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
  setSaveStatus('saving');
  cloudSaveDraft(true);
}

function applyDraftPayload(data) {
  writeForm(data.form || {});
  if (data.selectedTags) {
    state.selectedTags = {
      Strengths: new Set(data.selectedTags.Strengths || []),
      Improvements: new Set(data.selectedTags.Improvements || []),
      Encouragement: new Set(data.selectedTags.Encouragement || [])
    };
    TAG_CATEGORIES.forEach(cat => {
      const el = document.getElementById('tagList_' + cat.key);
      if (el) el.innerHTML = renderTagList(cat.key);
    });
  }
}

function loadDraft() {
  const k = draftKey();
  if (!k) return;
  let local = null;
  try {
    const raw = localStorage.getItem(k);
    if (raw) local = JSON.parse(raw);
  } catch (e) { console.warn(e); }
  if (local) {
    applyDraftPayload(local);
    setSaveStatus('saved');
  }
  // Then check the cloud; the newer copy wins.
  loadCloudDraft(k, local);
}

async function loadCloudDraft(k, local) {
  const id = draftIdentity();
  if (!id) return;
  const studentName = id.studentName;
  try {
    const r = await apiGet('tpGetDraft', id);
    if (!state.selectedStudent || state.selectedStudent['Student Name'] !== studentName || draftKey() !== k) return;
    const cloud = r && r.draft;
    if (!cloud) {
      if (local) setSaveStatus(draftIsEmpty(local) ? 'idle' : 'saved');   // local-only draft; it will sync on next change
      return;
    }
    const cloudAt = Date.parse(cloud.savedAt || r.updatedAt || 0) || 0;
    const localAt = local ? (Date.parse(local.savedAt || 0) || 0) : 0;
    if (!local || cloudAt > localAt) {
      applyDraftPayload(cloud);
      try { localStorage.setItem(k, JSON.stringify(cloud)); } catch (e) {}
      toast('Draft restored', '已从云端恢复上次保存的草稿', 'success');
    }
    setSaveStatus('cloud', formatTrackerDate(cloud.savedAt || r.updatedAt));
  } catch (e) {
    dlog('tpGetDraft ERROR', e.message);
    if (!state.selectedStudent || state.selectedStudent['Student Name'] !== studentName) return;
    if (local && !draftIsEmpty(local)) setSaveStatus('saved');
  }
}

function clearDraft() {
